name: check

# Templates run as code on a machine, so they are checked before they merge:
# every hook and config must be valid and named so that Gaudi runs it, every
# Brewfile must be readable, and every list must define its array.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
  # Packages are removed and deprecated upstream without any change here, so
  # the online check runs on a timer, not on pull requests.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: check-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: templates check
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      # The templates and Gaudi are checked out side by side, so the checker
      # only ever looks at the templates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: templates
      - name: Get Gaudi
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: g-udi/gaudi
          path: gaudi
      # macOS is only needed here: Homebrew has to read the Brewfiles.
      - name: Check the templates
        run: gaudi/bin/gaudi check templates

  # Hooks, configs and lists are all sourced by Gaudi's bash, so every shell
  # file is linted as bash. ShellCheck is preinstalled on the Linux runners.
  shellcheck:
    name: shellcheck
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: ShellCheck the shell files
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck -s bash -S warning

  # Asks Homebrew whether every package in the Brewfiles still exists. Kept out
  # of the pull request check so that an upstream removal never blocks a merge.
  online:
    name: templates check (online)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: templates
      - name: Get Gaudi
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: g-udi/gaudi
          path: gaudi
      - name: Check the templates against Homebrew
        run: gaudi/bin/gaudi check templates --online
