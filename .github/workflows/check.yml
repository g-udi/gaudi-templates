name: check

# Templates run as code on a machine, so they are checked before they merge:
# every hook and config must be valid and named so that Gaudi runs it, every
# Brewfile must be readable, and every list must define its array.
on:
  pull_request:
  merge_group:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: templates check
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Get Gaudi
        uses: actions/checkout@v4
        with:
          repository: g-udi/gaudi
          path: .gaudi
      - name: Check the templates
        run: .gaudi/bin/gaudi check "$GITHUB_WORKSPACE"
      - name: ShellCheck the hooks
        run: |
          brew install shellcheck
          find . -path ./.gaudi -prune -o -name '*.hooks.sh' -print0 | xargs -0 shellcheck -S warning
