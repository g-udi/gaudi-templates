name: check

# Templates run as code on a machine, so they are checked before they merge:
# every hook and config must be valid and named so that Gaudi runs it, every
# Brewfile must be readable, and every list must define its array.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: templates check
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      # The templates and Gaudi are checked out side by side, so the checker
      # only ever looks at the templates.
      - uses: actions/checkout@v4
        with:
          path: templates
      - name: Get Gaudi
        uses: actions/checkout@v4
        with:
          repository: g-udi/gaudi
          path: gaudi
      - name: Check the templates
        run: gaudi/bin/gaudi check templates
      # Hooks, configs and lists are all sourced by Gaudi's bash, so every
      # shell file is linted as bash, not only the hooks.
      - name: ShellCheck the shell files
        run: |
          brew install shellcheck
          find templates -name '*.sh' -not -path 'templates/.git/*' -print0 | xargs -0 shellcheck -s bash -S warning
